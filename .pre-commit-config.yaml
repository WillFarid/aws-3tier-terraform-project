# -----------------------------------------------------------------------------
# .pre-commit-config.yaml
# These hooks run automatically on every `git commit`. If one fails, the commit
# is blocked until you fix it. `rev` pins each hook to a released version.
# -----------------------------------------------------------------------------
repos:
  # Generic hygiene: whitespace, file endings, accidental secrets.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key # blocks commits containing private keys

  # Terraform hooks (they call the tools you installed in 8.1).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  # Security scanning. Checkov installs itself inside pre-commit.
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.30
    hooks:
      - id: checkov
        exclude: ^environments/dev/
        args:
          - --framework
          - terraform
          - --quiet
          - --compact
          - --skip-path
          - environments/dev
